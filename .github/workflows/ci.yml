name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: node dist/cli.js --help
      - run: pnpm pack --dry-run | tee /tmp/pack.txt
      - run: grep -F "config/chains.example.yaml" /tmp/pack.txt && grep -F ".env.example" /tmp/pack.txt
      - run: cp .env.example .env && cp config/chains.example.yaml config/chains.yaml
      - run: docker compose config --quiet
      - run: docker build --tag safe-everywhere:ci .
