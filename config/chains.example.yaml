# Copy this file to chains.yaml. Environment variables are expanded before YAML parsing.
databasePath: ../data/safe-everywhere.sqlite
pollIntervalMs: 12000
maxBlockRange: 2000
reorgLookbackBlocks: 12
rpcTimeoutMs: 20000
deployerPrivateKeyEnv: DEPLOYER_PRIVATE_KEY

policy:
  # The transaction sender that is allowed to create source Safes. This is the
  # primary gas-drain defense. Add allowedSafeAddresses for pre-enrolled addresses.
  allowedCreators:
    - "${SAFE_CREATOR_ADDRESS}"
  # Quote literal addresses too: ["0x1234..."] (unquoted 0x values are YAML numbers).
  allowedSafeAddresses: []
  maxDeploymentsPerRun: 12
  maxDeploymentsPerDay: 25
  maxTargetsPerSafe: 12
  maxEstimatedGas: 500000
  maxFeePerGasGwei: 500
  requireCanonicalSetup: true
  allowContractOwners: false

chains:
  ethereum:
    name: Ethereum
    chainId: 1
    rpcUrl: ${ETHEREUM_RPC_URL}
    deploy: true
    create2Compatible: true
    confirmations: 20
    startBlock: latest
  optimism:
    name: OP Mainnet
    chainId: 10
